plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mengyin.prank'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mengyin.prank'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用调试证书签名，方便自己直接安装
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
