plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mengyin.prank'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mengyin.prank'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // 固定签名：以后每次更新都能直接覆盖安装，语音包不会丢
    signingConfigs {
        fixed {
            storeFile file('mengyin.keystore')
            storePassword 'mengyin123'
            keyAlias 'mengyin'
            keyPassword 'mengyin123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
